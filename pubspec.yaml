name: countly_sdk_dart
description: "Countly Dart SDK for tracking user actions, events, views, and user profiles on all platforms supported by Dart and Flutter."
version: 26.1.0
homepage: https://countly.com
repository: https://github.com/Countly/countly-sdk-dart
issue_tracker: https://github.com/Countly/countly-sdk-dart/issues
documentation: https://support.count.ly/hc/en-us/articles/
topics:
  - analytics
  - countly
  - events
  - tracking
  - user-profiles
platforms:
  android:
  ios:

environment:
  sdk: ^3.0.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  uuid: ^4.5.1
  meta: ^1.12.0
  shared_preferences: ^2.3.2
  web: ^0.5.1

flutter:
  plugin:
    platforms:
      android:
        package: ly.count.dart.countly_sdk_dart
        pluginClass: CountlySdkDartPlugin
      ios:
        pluginClass: CountlySdkDartPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
