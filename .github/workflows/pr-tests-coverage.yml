name: PR Tests and Coverage

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze the code
        run: flutter analyze --no-pub

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Calculate coverage percentage
        id: coverage
        shell: bash
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info not found"
            exit 1
          fi

          LF=$(grep -ho 'LF:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          LH=$(grep -ho 'LH:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')

          if [ "$LF" -eq 0 ]; then
            PCT="0.00"
          else
            PCT=$(awk "BEGIN {printf \"%.2f\", ($LH/$LF)*100}")
          fi

          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "covered_lines=$LH" >> "$GITHUB_OUTPUT"
          echo "total_lines=$LF" >> "$GITHUB_OUTPUT"

      - name: Publish coverage summary
        run: |
          echo "### Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: **${{ steps.coverage.outputs.percentage }}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Covered lines: ${{ steps.coverage.outputs.covered_lines }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total lines: ${{ steps.coverage.outputs.total_lines }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the CI report fragment
        env:
          PERCENTAGE: ${{ steps.coverage.outputs.percentage }}
          COVERED_LINES: ${{ steps.coverage.outputs.covered_lines }}
          TOTAL_LINES: ${{ steps.coverage.outputs.total_lines }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-report-coverage"
          {
            echo "Coverage"
            echo "Line coverage $PERCENTAGE%"
            echo "- Coverage: **$PERCENTAGE%**"
            echo "- Covered lines: $COVERED_LINES"
            echo "- Total lines: $TOTAL_LINES"
          } > "$RUNNER_TEMP/ci-report-coverage/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-coverage
          path: ${{ runner.temp }}/ci-report-coverage
          if-no-files-found: ignore
